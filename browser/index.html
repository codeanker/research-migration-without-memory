<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Handover experiment: WebContainer to E2B</title>
  </head>
  <body>
    <h1>Handover experiment: WebContainer to E2B</h1>
    <p>
      Stage: <select id="stage"></select> Runs: <input id="runs" type="number" value="3" min="1" />
      Logging interval (ms): <input id="logInterval" type="number" value="1000" min="1" />
      Stop offset (ms): <input id="stopOffset" value="" size="8" placeholder="random" />
      Runner URL: <input id="runnerUrl" value="/run" size="30" />
    </p>
    <button id="start">Start</button>
    <pre id="log" style="white-space: pre-wrap; background: #111; color: #0f0; padding: 1em"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
